name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: slopproof_test
          POSTGRES_USER: slopproof
          POSTGRES_PASSWORD: slopproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slopproof -d slopproof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      object-store:
        image: versity/versitygw:v1.4.1@sha256:0400cb59f59da0f1cf9f7fd49505191abc348dfadf54509bf1988caaff4eb96f
        env:
          ROOT_ACCESS_KEY: slopproof-local
          ROOT_SECRET_KEY: slopproof-local-storage-secret
          VGW_PORT: :7070
          VGW_IAM_DIR: /mnt
          VGW_VERSIONING_DIR: /var/tmp
          VGW_BACKEND: posix
          VGW_BACKEND_ARGS: /home
        ports:
          - 9000:7070
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:release-audits
      - run: pnpm test:live-smoke-contracts
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://slopproof:slopproof@localhost:5432/slopproof_test
      - run: pnpm build
      - run: pnpm audit:doc-links
      - run: pnpm audit:secrets
      - run: pnpm audit:history-secrets
      - run: pnpm dev:keys
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://slopproof:slopproof@localhost:5432/slopproof_test
      - name: Seed demo twice and verify idempotence
        run: |
          pnpm db:seed
          pnpm db:seed
          pnpm exec tsx scripts/verify-demo-seed.ts
        env:
          DATABASE_URL: postgres://slopproof:slopproof@localhost:5432/slopproof_test
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prepare E2E object storage
        run: pnpm test:storage:prepare
        env:
          S3_REGION: us-east-1
          S3_BUCKET: slopproof-evidence
          S3_ACCESS_KEY_ID: slopproof-local
          S3_SECRET_ACCESS_KEY: slopproof-local-storage-secret
          S3_CONTROL_ENDPOINT: http://127.0.0.1:9000
      - run: pnpm test:e2e
        env:
          APP_BASE_URL: http://127.0.0.1:3000
          DEPLOYMENT_PROFILE: local
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_WORKER_SMOKE: "true"
          DATABASE_URL: postgres://slopproof:slopproof@localhost:5432/slopproof_test
          GITHUB_ADAPTER: fake
          GENERATION_PROVIDER: fake
          EVIDENCE_STORAGE_PROVIDER: s3
          S3_REGION: us-east-1
          S3_BUCKET: slopproof-evidence
          S3_ACCESS_KEY_ID: slopproof-local
          S3_SECRET_ACCESS_KEY: slopproof-local-storage-secret
          S3_CONTROL_ENDPOINT: http://127.0.0.1:9000
          S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
          KEY_WRAPPING_PROVIDER: local
          KEY_WRAPPING_PUBLIC_KEY_PATH: ${{ github.workspace }}/infra/docker/secrets/wrapping-public.pem
          KEY_WRAPPING_PRIVATE_KEY_PATH: ${{ github.workspace }}/infra/docker/secrets/wrapping-private.pem
          TRANSCRIPTION_PROVIDER: fake
          MULTIMODAL_JUDGE_PROVIDER: fake
          SESSION_SECRET: local-session-secret-change-me-00000
          GITHUB_WEBHOOK_SECRET: local-webhook-secret-change-me-0000
          GITHUB_CLIENT_ID: fake-local
          GITHUB_CLIENT_SECRET: fake-local
          WORKER_INTERNAL_URL: http://127.0.0.1:4001
          WORKER_INTERNAL_SECRET: local-worker-secret-change-me-000000
          PROVIDER_PAYLOAD_KEY_BASE64: cHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHA=
          WORKER_HOST: 127.0.0.1
          WORKER_PORT: "4001"
          DEMO_MODE: "true"
          DEMO_FAKE_MEDIA: "false"
      - run: pnpm audit:boundaries
      - run: pnpm format:check
